[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["."]

[project]
name = "nyayabot"
version = "0.1.0"
description = "Production-grade multi-agent RAG for Indian Legal & Government Services"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # Core orchestration
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-groq>=0.2.0",
    "langchain-ollama>=0.1.0",
    "langchain-qdrant>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",

    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.0.0",
    "PyJWT>=2.10.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",

    # Vector DB & Search
    "qdrant-client>=1.12.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",

    # LLM & Embeddings
    "google-generativeai>=0.8.0",
    "tiktoken>=0.7.0",

    # Data Processing
    "pdfplumber>=0.11.0",
    "pypdf>=4.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "requests>=2.31.0",
    "aiohttp>=3.10.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",

    # Cache & Memory
    "redis[asyncio]>=5.0.0",
    "upstash-redis>=1.0.0",

    # Evaluation
    "ragas>=0.1.21",
    "datasets>=2.20.0",

    # Observability
    "langsmith>=0.1.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "opentelemetry-sdk>=1.25.0",

    # Config
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "locust>=2.29.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
