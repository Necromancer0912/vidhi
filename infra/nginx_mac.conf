worker_processes  1;

# Log and pid locations set to /tmp to run without sudo permissions
error_log  /tmp/nyayabot_nginx_error.log warn;
pid        /tmp/nyayabot_nginx.pid;

events {
    worker_connections  1024;
}

http {
    types {
        text/html                             html htm shtml;
        text/css                              css;
        text/xml                              xml;
        image/gif                             gif;
        image/jpeg                            jpeg jpg;
        application/javascript                js;
        application/json                      json;
        image/png                             png;
        image/svg+xml                         svg svgz;
    }
    
    default_type  application/octet-stream;
    
    # Access logs set to /tmp
    access_log  /tmp/nyayabot_nginx_access.log;

    sendfile        on;
    keepalive_timeout  65;

    # Load balancing backend instances on ports 8001 and 8002
    upstream fastapi_backend {
        server 127.0.0.1:8001;
        server 127.0.0.1:8002;
    }

    server {
        # Localhost only: the Tailscale Funnel connects locally. Listening on all
        # interfaces would let anyone on the same network bypass it.
        listen       127.0.0.1:8000;
        server_name  localhost;

        # Largest legitimate body is a saved chat history (~1.5 MB).
        client_max_body_size 2M;
        server_tokens off;

        # Internal endpoints never leave this machine.
        location ~ ^/(prometheus|docs|redoc|openapi\.json)(/|$) {
            return 404;
        }

        location / {
            proxy_pass http://fastapi_backend;
            
            # Standard headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Server-Sent Events (SSE) Streaming Configuration (Critical for Chat Response Streaming)
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 600s;
        }
    }
}
